[package]
name = "dver"
version = "0.2.0"
edition = "2021"
authors = ["Sergio Triana Escobedo <stescobedo.31@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "CLI tool for managing .NET SDK versions, including installation and version switching."
homepage = "https://github.com/stescobedo92/dotnet-version-manager"
repository = "https://github.com/stescobedo92/dotnet-version-manager"
keywords = ["cli"]
readme = "README.md"
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
flate2 = "1.1.8"
futures-util = "0.3.31"
indicatif = "0.18.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4.44"
tokio = { version = "1.0", features = ["full"] }
zip = "7.1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.55.0"
