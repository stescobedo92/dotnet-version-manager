name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      crate_name: ${{ steps.meta.outputs.crate_name }}
      crate_description: ${{ steps.meta.outputs.crate_description }}
      release_name: ${{ steps.meta.outputs.release_name }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read crate metadata
        id: meta
        shell: bash
        run: |
          crate_name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          crate_description=$(sed -n 's/^description = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag_name="v${version}"
          release_name="${crate_name} v${version}"

          git fetch --tags --force

          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            should_release=false
          else
            should_release=true
          fi

          echo "crate_name=${crate_name}" >> "$GITHUB_OUTPUT"
          echo "crate_description=${crate_description}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Job-level `if` cannot reference `secrets`; gate publish on the env instead.
      # Skip if this version is already on crates.io so workflow re-runs
      # (e.g. after fixing an unrelated job) stay green.
      - name: Publish crate
        if: env.CARGO_REGISTRY_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CRATE_NAME: ${{ needs.prepare.outputs.crate_name }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}")
          if [ "$status" = "200" ]; then
            echo "${CRATE_NAME} ${VERSION} is already published on crates.io; skipping."
            exit 0
          fi
          cargo publish --locked

  build-assets:
    name: Build release assets on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: dver
            artifact_suffix: x86_64-unknown-linux-gnu
          - os: windows-latest
            binary_name: dver.exe
            artifact_suffix: x86_64-pc-windows-msvc
          - os: macos-latest
            binary_name: dver
            artifact_suffix: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive_name="dver-${VERSION}-${{ matrix.artifact_suffix }}.tar.gz"
          mkdir -p dist
          cp "target/release/${{ matrix.binary_name }}" dist/
          cp README.md dist/
          tar -czf "${archive_name}" -C dist "${{ matrix.binary_name }}" README.md

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $archiveName = "dver-$env:VERSION-${{ matrix.artifact_suffix }}.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          Copy-Item README.md dist/README.md
          Compress-Archive -Path "dist/${{ matrix.binary_name }}","dist/README.md" -DestinationPath $archiveName -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_suffix }}
          path: dver-${{ needs.prepare.outputs.version }}-${{ matrix.artifact_suffix }}*

  build-snap:
    name: Build Snap package
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    outputs:
      snap_file: ${{ steps.build-snap.outputs.snap }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snap
        id: build-snap
        uses: canonical/action-build@v1
        with:
          snapcraft-args: pack

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-amd64
          path: ${{ steps.build-snap.outputs.snap }}

  publish-snap:
    name: Publish Snap to Snap Store
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-snap
    if: needs.prepare.outputs.should_release == 'true'
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap-amd64
          path: snap-artifact

      - name: Install Snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: sudo snap install snapcraft --classic

      - name: Authenticate with Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          printf '%s' "$SNAPCRAFT_STORE_CREDENTIALS" > snapcraft.login
          snapcraft login --with snapcraft.login

      - name: Publish snap
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          SNAPCRAFT_RELEASE_CHANNEL: ${{ vars.SNAPCRAFT_RELEASE_CHANNEL || 'stable' }}
        run: |
          snap_file=$(find snap-artifact -maxdepth 1 -name '*.snap' | head -n1)
          test -n "$snap_file"
          snapcraft upload --release="${SNAPCRAFT_RELEASE_CHANNEL}" "$snap_file"

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-assets
      - build-snap
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/**/*

  publish-scoop-bucket:
    name: Publish Scoop manifest
    runs-on: ubuntu-latest
    needs:
      - prepare
      - github-release
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows release asset
        uses: actions/download-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: scoop-release

      - name: Update Scoop bucket branch
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          CRATE_DESCRIPTION: ${{ needs.prepare.outputs.crate_description }}
          SCOOP_BUCKET_BRANCH: ${{ vars.SCOOP_BUCKET_BRANCH || 'scoop-bucket' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          archive_name="dver-${VERSION}-x86_64-pc-windows-msvc.zip"
          archive_path="scoop-release/${archive_name}"
          sha256=$(sha256sum "${archive_path}" | awk '{print $1}')
          download_url="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${archive_name}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "${SCOOP_BUCKET_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${SCOOP_BUCKET_BRANCH}:${SCOOP_BUCKET_BRANCH}"
            git checkout "${SCOOP_BUCKET_BRANCH}"
          else
            git checkout -b "${SCOOP_BUCKET_BRANCH}"
          fi

          mkdir -p bucket
          cat > bucket/dver.json <<EOF
          {
            "version": "${VERSION}",
            "description": "${CRATE_DESCRIPTION}",
            "homepage": "https://github.com/${REPOSITORY}",
            "license": "MIT OR Apache-2.0",
            "notes": [
              "Run 'dver setup' in a new PowerShell session after installation."
            ],
            "architecture": {
              "64bit": {
                "url": "${download_url}",
                "hash": "${sha256}"
              }
            },
            "bin": "dver.exe",
            "checkver": {
              "github": "https://github.com/${REPOSITORY}"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${REPOSITORY}/releases/download/v\$version/dver-\$version-x86_64-pc-windows-msvc.zip"
                }
              }
            }
          }
          EOF

          git add bucket/dver.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already up to date."
            exit 0
          fi

          git commit -m "chore: update scoop manifest for ${TAG_NAME} [skip ci]"
          git push origin "${SCOOP_BUCKET_BRANCH}"
