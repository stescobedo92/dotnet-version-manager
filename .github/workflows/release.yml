name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      crate_name: ${{ steps.meta.outputs.crate_name }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read crate metadata
        id: meta
        shell: bash
        run: |
          crate_name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag_name="v${version}"

          git fetch --tags --force

          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            should_release=false
          else
            should_release=true
          fi

          echo "crate_name=${crate_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - prepare
      - publish-crate
      - build-assets
    if: needs.prepare.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

  build-assets:
    name: Build release assets on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: dver
            artifact_suffix: x86_64-unknown-linux-gnu
          - os: windows-latest
            binary_name: dver.exe
            artifact_suffix: x86_64-pc-windows-msvc
          - os: macos-latest
            binary_name: dver
            artifact_suffix: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive_name="dver-${VERSION}-${{ matrix.artifact_suffix }}.tar.gz"
          mkdir -p dist
          cp "target/release/${{ matrix.binary_name }}" dist/
          cp README.md dist/
          tar -czf "${archive_name}" -C dist "${{ matrix.binary_name }}" README.md

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $archiveName = "dver-$env:VERSION-${{ matrix.artifact_suffix }}.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          Copy-Item README.md dist/README.md
          Compress-Archive -Path "dist/${{ matrix.binary_name }}","dist/README.md" -DestinationPath $archiveName -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_suffix }}
          path: dver-${{ needs.prepare.outputs.version }}-${{ matrix.artifact_suffix }}*

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-assets
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          generate_release_notes: true
          files: release-assets/**/*
